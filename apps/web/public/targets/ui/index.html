<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-brand: #4b621c;
      --color-ink: #22261f;
      --color-on-brand: #f7f8f3;
      --color-surface: #ffffff;
      --scene-background: #f7f8f3;
      --muted: #73786e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #e9ebe4;
      color: var(--color-ink);
      font-family: Manrope, system-ui, sans-serif;
    }

    .scene {
      position: relative;
      width: min(440px, 100%);
      height: 520px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 16px;
      padding: 24px;
      background: var(--scene-background);
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      padding: 20px;
      background: var(--color-surface);
      border-radius: 12px;
      opacity: 0;
      animation: card-enter 240ms cubic-bezier(.2, 0, 0, 1) forwards;
    }

    .title {
      margin: 0;
      color: var(--color-ink);
      font-family: Newsreader, Georgia, serif;
      font-size: 22px;
      font-weight: 650;
      line-height: 1.15;
    }

    .copy {
      margin: 0;
      color: var(--muted);
      font-family: Manrope, system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
    }

    .primary-button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      background: var(--color-brand);
      color: var(--color-on-brand);
      font: 600 14px/1.2 Manrope, system-ui, sans-serif;
      cursor: pointer;
      transition:
        opacity 100ms ease,
        transform 100ms ease,
        box-shadow 100ms ease;
    }

    .primary-button:hover {
      opacity: .92;
    }

    .primary-button:active {
      opacity: .84;
      transform: translateY(1px);
    }

    .primary-button:focus-visible,
    .secondary-button:focus-visible {
      outline: 3px solid rgba(75, 98, 28, .32);
      outline-offset: 3px;
    }

    .primary-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .dialog-layer[hidden] {
      display: none;
    }

    .dialog-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(34, 38, 31, .28);
      animation: backdrop-enter 160ms ease-out both;
    }

    .dialog {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 18px 48px rgba(34, 38, 31, .16);
      animation: dialog-enter 180ms cubic-bezier(.2, 0, 0, 1) both;
    }

    .dialog-title {
      margin: 0;
      color: var(--color-ink);
      font-family: Newsreader, Georgia, serif;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.2;
    }

    .dialog-body {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .secondary-button {
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      background: #eef0e8;
      color: var(--color-ink);
      font: 600 13px/1.2 Manrope, system-ui, sans-serif;
      cursor: pointer;
    }

    @keyframes card-enter {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes backdrop-enter {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes dialog-enter {
      from {
        opacity: 0;
        transform: translateY(6px) scale(.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
      }

      .scene {
        width: 100%;
        min-height: 100vh;
        height: auto;
        padding: 24px;
      }

      .card {
        padding: 12px;
        gap: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      .dialog-layer,
      .dialog {
        animation-duration: 1ms !important;
      }

      .primary-button {
        transition: none;
      }
    }
  </style>
<style id="visualspec-scrollbar">html,body{scrollbar-width:thin;scrollbar-color:rgba(32,38,31,.16) transparent}html::-webkit-scrollbar,body::-webkit-scrollbar{width:8px;height:8px}html::-webkit-scrollbar-track,body::-webkit-scrollbar-track{background:transparent}html::-webkit-scrollbar-thumb,body::-webkit-scrollbar-thumb{background:rgba(32,38,31,.12);border-radius:999px;border:2px solid transparent;background-clip:padding-box}</style></head>

<body>
  <main class="scene" aria-labelledby="checkout-title">
    <section class="card">
      <h1 class="title" id="checkout-title">Review order</h1>
      <p class="copy">Shipping arrives Tuesday.</p>
      <button class="primary-button" id="continue-button" type="button">
        Continue
      </button>
    </section>

    <div class="dialog-layer" id="dialog-layer" hidden>
      <section
        class="dialog"
        id="confirm-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="dialog-title"
        aria-describedby="dialog-body"
      >
        <h2 class="dialog-title" id="dialog-title">Confirm checkout</h2>
        <p class="dialog-body" id="dialog-body">
          Continue is a visual action. It does not call an API.
        </p>

        <div class="dialog-actions">
          <button class="secondary-button" id="close-dialog" type="button">
            Close
          </button>
        </div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      const openButton = document.getElementById("continue-button");
      const layer = document.getElementById("dialog-layer");
      const dialog = document.getElementById("confirm-dialog");
      const closeButton = document.getElementById("close-dialog");

      let previousFocus = null;

      const getFocusable = () =>
        [...dialog.querySelectorAll(
          'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
        )];

      function openDialog() {
        previousFocus = document.activeElement;
        layer.hidden = false;
        closeButton.focus();
      }

      function closeDialog() {
        layer.hidden = true;
        if (previousFocus instanceof HTMLElement) {
          previousFocus.focus();
        }
      }

      openButton.addEventListener("click", openDialog);
      closeButton.addEventListener("click", closeDialog);

      layer.addEventListener("click", (event) => {
        if (event.target === layer) {
          closeDialog();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (layer.hidden) return;

        if (event.key === "Escape") {
          event.preventDefault();
          closeDialog();
          return;
        }

        if (event.key !== "Tab") return;

        const focusable = getFocusable();
        if (!focusable.length) return;

        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });
    })();
  </script>
</body>
</html>
